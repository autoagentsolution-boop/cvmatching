name: Refresh job pool

# Pool refresh — every 3 days at 19:00 UTC (02:00 ICT next day, low-traffic
# window). Scrapes new jobs from each enabled source, ingests fresh ones
# into Postgres, expires stale ones. Complements the daily Vercel cron at
# /api/jobs/refresh which does HEAD-check liveness only.
#
# Admin manual trigger:
#   - GitHub UI:  Actions → Refresh job pool → Run workflow
#   - GitHub CLI: gh workflow run refresh-jobs.yml
#   - Optional inputs to override defaults per-run.
#
# Secrets required (set via `gh secret set <NAME>` from the runbook):
#   GEMINI_API_KEY, DATABASE_URL, DATABASE_URL_UNPOOLED,
#   KV_REST_API_URL, KV_REST_API_TOKEN
# Optional:
#   EMBED_CACHE_SECRET, ALERT_WEBHOOK_URL

on:
  schedule:
    # Every 3 days at 19:00 UTC. Cron in GH Actions runs on UTC.
    # Adjust to e.g. "0 19 */7 * *" for weekly cadence.
    - cron: '0 19 */3 * *'
  workflow_dispatch:
    inputs:
      topcv_slugs:
        description: 'TopCV slugs (space-separated). Default: full tech + non-tech sweep.'
        required: false
        type: string
      pages:
        description: 'Pages per TopCV slug (1-3 recommended). Default: 3.'
        required: false
        type: string
        default: '3'
      max_age_days:
        description: 'Reject jobs posted > N days ago. Default: 3 (project freshness cap).'
        required: false
        type: string
        default: '3'

# Cancel any in-flight run if a new one fires (prevents overlap on manual+schedule collision)
concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    name: Scrape + ingest + expire
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: cv-ex-refactor

    env:
      # Required for ingest CLI
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
      # Optional
      EMBED_CACHE_SECRET: ${{ secrets.EMBED_CACHE_SECRET }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      # Freshness override (default 3 days; manual run can override)
      INGEST_MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '3' }}
      # TopCV pages override (default 3)
      PAGES: ${{ github.event.inputs.pages || '3' }}
      # Force colored logs even on a non-TTY runner
      FORCE_COLOR: '1'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: cv-ex-refactor/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify curl available (Cloudflare bypass)
        run: curl --version

      # Materialize .env.local from secrets — `pnpm run ingest` uses
      # `tsx --env-file=.env.local` and expects this file to exist.
      # File is in runner-ephemeral fs and gitignored.
      - name: Write .env.local from secrets
        env:
          ENV_GEMINI: ${{ secrets.GEMINI_API_KEY }}
          ENV_DB: ${{ secrets.DATABASE_URL }}
          ENV_DB_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          ENV_KV_URL: ${{ secrets.KV_REST_API_URL }}
          ENV_KV_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          ENV_EMBED_CACHE: ${{ secrets.EMBED_CACHE_SECRET }}
          ENV_ALERT_HOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          # Write each var on a separate line, double-quote values to
          # tolerate special chars in DB URLs / tokens.
          {
            echo "GEMINI_API_KEY=\"${ENV_GEMINI}\""
            echo "DATABASE_URL=\"${ENV_DB}\""
            echo "DATABASE_URL_UNPOOLED=\"${ENV_DB_UNPOOLED}\""
            echo "KV_REST_API_URL=\"${ENV_KV_URL}\""
            echo "KV_REST_API_TOKEN=\"${ENV_KV_TOKEN}\""
            echo "EMBED_CACHE_SECRET=\"${ENV_EMBED_CACHE}\""
            echo "ALERT_WEBHOOK_URL=\"${ENV_ALERT_HOOK}\""
            echo "INGEST_MAX_AGE_DAYS=\"${INGEST_MAX_AGE_DAYS}\""
          } > .env.local
          # Fail fast if any critical var is unset (catches missing secret
          # before we burn 30 min on a broken run).
          for k in GEMINI_API_KEY DATABASE_URL KV_REST_API_URL KV_REST_API_TOKEN; do
            if grep -q "^${k}=\"\"$" .env.local; then
              echo "::error::Required secret ${k} is empty. Set it via: gh secret set ${k}"
              exit 1
            fi
          done
          echo "Wrote .env.local with $(wc -l < .env.local) entries"

      - name: Pre-refresh stats
        run: pnpm run ingest stats || true

      # ── TopCV: tech sweep (server-paged slugs first, highest yield) ────
      - name: TopCV — tech sweep
        if: github.event.inputs.topcv_slugs == ''
        run: |
          pnpm run ingest topcv \
            tim-viec-lam-lap-trinh-vien \
            tim-viec-lam-it-phan-mem \
            tim-viec-lam-data-engineer \
            tim-viec-lam-cong-nghe-thong-tin-cr257 \
            --pages "$PAGES"

      - name: TopCV — non-tech sweep
        if: github.event.inputs.topcv_slugs == ''
        run: |
          pnpm run ingest topcv \
            tim-viec-lam-ke-toan \
            tim-viec-lam-marketing \
            tim-viec-lam-nhan-vien-kinh-doanh \
            tim-viec-lam-hanh-chinh-nhan-su \
            tim-viec-lam-ngan-hang \
            --pages "$PAGES"

      - name: TopCV — operator-provided slugs (manual run only)
        if: github.event.inputs.topcv_slugs != ''
        run: |
          # shellcheck disable=SC2086
          pnpm run ingest topcv ${{ github.event.inputs.topcv_slugs }} --pages "$PAGES"

      # ── ITviec — uses existing runner ──────────────────────────────────
      - name: ITviec — tech keywords
        continue-on-error: true
        run: |
          pnpm run ingest itviec \
            data-engineer \
            senior-data-engineer \
            backend-developer \
            devops \
            --pages "$PAGES"

      # ── Expire pass: mark stale jobs as inactive ───────────────────────
      # Existing `ingest expire` marks verifiedAt > 21d as expired.
      # Daily Vercel cron at /api/jobs/refresh handles HEAD-check liveness.
      - name: Expire stale jobs
        continue-on-error: true
        run: pnpm run ingest expire

      - name: Post-refresh stats
        run: pnpm run ingest stats

      - name: Summary
        if: always()
        run: |
          echo "## Refresh complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Max age cap: $INGEST_MAX_AGE_DAYS days" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages per slug: $PAGES" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          pnpm run ingest stats 2>&1 | tail -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
